[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infinity-context"
version = "0.1.0"
description = "Reliable memory and context infrastructure for AI coding agents"
readme = { file = "README.md", content-type = "text/markdown" }
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Infinity Context contributors" },
]
keywords = ["agents", "ai", "coding-agents", "context", "memory", "mcp", "rag"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.18.4,<2.0.0",
  "asyncpg>=0.31.0,<1.0.0",
  "cryptography==50.0.0",
  "fastapi>=0.136.3,<1.0.0",
  "greenlet>=3.5.1,<4.0.0",
  "httpx>=0.28.1,<1.0.0",
  "pillow>=12.2.0,<13.0.0",
  "pydantic-settings>=2.14.1,<3.0.0",
  "pypdf>=6.13.2,<7.0.0",
  "sqlalchemy>=2.0.50,<3.0.0",
  "uvicorn>=0.48.0,<1.0.0",
]

[project.optional-dependencies]
qdrant = [
  "qdrant-client>=1.18.0,<2.0.0",
]
qdrant-hybrid = [
  "qdrant-client>=1.18.0,<2.0.0",
  "fastembed>=0.8.0,<1.0.0",
]
openai = [
  "openai>=2.41.1,<3.0.0",
]
graphiti = [
  "graphiti-core>=0.29.1,<1.0.0",
]
docling = [
  "docling>=2.102.1,<3.0.0",
]
asr = [
  "faster-whisper>=1.2.1,<2.0.0",
]
s3 = [
  "boto3>=1.43.32,<2.0.0",
]
cognee = [
  "cognee>=1.1.2,<2.0.0",
]
mcp = [
  "mcp>=1.27.1,<2.0.0",
]
dev = [
  "aiosqlite>=0.22.1,<1.0.0",
  "mcp>=1.27.1,<2.0.0",
  "pytest>=9.0.3,<10.0.0",
  "ruff>=0.15.14,<1.0.0",
]

[project.scripts]
infinity-context = "infinity_context_cli.cli:main"
infinity-context-admin = "infinity_context_server.admin:main"
infinity-context-managed-preflight = "infinity_context_server.memory_comparison_managed_preflight_cli:main"
infinity-context-managed-production-pre-readiness = "infinity_context_server.memory_comparison_managed_production_cli:main"
infinity-context-managed-live-canary = "infinity_context_server.memory_comparison_managed_live_cli:main"
infinity-context-managed-v5-recover = "infinity_context_server.memory_comparison_managed_v5_recovery_bootstrap:main"
infinity-context-managed-strict-v4-prepare = "infinity_context_server.memory_comparison_managed_v5_strict_v4_cli:main"
infinity-context-managed-strict-v4-cleanup = "infinity_context_server.memory_comparison_managed_v5_strict_v4_cleanup_cli:main"
infinity-context-publishable-inputs = "infinity_context_server.publishable_input_preparation.cli:main"
infinity-context-publishable-canary = "infinity_context_server.publishable_durable_scheduler.publishable_canary_cli:main"
infinity-context-publishable-fresh-chain-canary = "infinity_context_server.publishable_fresh_chain_canary.cli:main"
infinity-context-publishable-run = "infinity_context_server.publishable_durable_scheduler.publishable_run_cli:main"
infinity-context-publishable-mem0-v5 = "publishable_mem0_v5.cli:main"
infinity-context-mcp = "infinity_context_mcp.server:main"
infinity-context-mcp-bench = "infinity_context_mcp.bench:main"
infinity-context-mcp-agent-bench = "infinity_context_mcp.agent_behavior_bench:main"
infinity-context-obsidian = "infinity_context_obsidian.cli:main"

[project.entry-points."infinity_context.publishable_run_dependencies"]
mem0-infinity-production-v1 = "publishable_mem0_v5.run_provider:Mem0InfinityPublishableRunDependencyFactory"

[project.entry-points."infinity_context.publishable_input_preparation_dependencies"]
mem0-infinity-production-v1 = "publishable_mem0_v5.input_provider:Mem0InfinityPublishableInputPreparationDependencyFactory"

[project.urls]
Homepage = "https://github.com/777genius/infinity-context"
Documentation = "https://github.com/777genius/infinity-context#readme"
Repository = "https://github.com/777genius/infinity-context.git"
Issues = "https://github.com/777genius/infinity-context/issues"
Changelog = "https://github.com/777genius/infinity-context/releases"

[tool.setuptools.packages.find]
where = [
  "packages/infinity_context_core",
  "packages/infinity_context_server",
  "packages/infinity_context_runtime_bridge",
  "packages/infinity_context_adapters",
  "packages/infinity_context_contracts",
  "packages/infinity_context_sdk",
  "packages/infinity_context_mcp",
  "packages/infinity_context_cli",
  "packages/infinity_context_obsidian",
  "benchmarks/mem0-oss-adapter-v5/deployment",
]

[tool.setuptools.package-data]
infinity_context_adapters = [
  "extraction/prompts/*.md",
  "extraction/schemas/*.json",
  "postgres/migrations/*.sql",
  "postgres/maintenance/*.sql",
  "postgres/provisioning/*.sql",
]
infinity_context_contracts = [
  "fixtures/context_retrieval_v2/*.json",
]
infinity_context_server = [
  "web/*.html",
  "web/assets/*.css",
  "web/assets/*.js",
]
infinity_context_obsidian = [
  "plugin_bundle/*",
]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/infinity_context_core/infinity_context_core/features"]
markers = [
  "disposable_root: mandatory E2E contracts requiring the disposable root CI harness",
  "synthetic_2040: opt-in provider-free synthetic 2,040-case contracts",
]
pythonpath = [
  ".",
  "packages/infinity_context_core",
  "packages/infinity_context_server",
  "packages/infinity_context_runtime_bridge",
  "packages/infinity_context_adapters",
  "packages/infinity_context_contracts",
  "packages/infinity_context_sdk",
  "packages/infinity_context_mcp",
  "packages/infinity_context_cli",
  "packages/infinity_context_obsidian",
  "benchmarks/mem0-oss-adapter-v5/deployment",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []
