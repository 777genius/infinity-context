services:
  mem0-oss-adapter-v5:
    build:
      context: ..
      dockerfile: mem0-oss-adapter-v5/Dockerfile
      additional_contexts:
        source-authority: ${MEM0_V5_SOURCE_AUTHORITY_PIN_DIR:?set immutable Pin B directory}
        phase-c-authority: ${MEM0_V5_SOURCE_AUTHORITY_DIR:?set pinned Infinity source 9499b9c2 directory}
      secrets:
        - source: source-authority-manifest-sha256
          target: source_authority_manifest_sha256
    network_mode: host
    user: "65532:65532"
    read_only: true
    init: true
    restart: "no"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 4g
    cpus: 2.0
    environment:
      MEM0_V5_INPUT_MANIFEST_FILE: /run/mem0-v5-input/manifest.json
      MEM0_V5_STATE_DB_FILE: /run/mem0-v5-state/operations.sqlite3
      MEM0_V5_INGRESS_BEARER_FILE: /run/secrets/ingress-bearer
      MEM0_V5_STATE_HMAC_FILE: /run/secrets/state-hmac
      MEM0_V5_RUNTIME_BEARER_FILE: /run/secrets/runtime-bearer
      MEM0_V5_RECEIPT_SECRET_FILE: /run/secrets/runtime-receipt-secret
      MEM0_V5_RUNTIME_TRANSPORT_ORIGIN_FILE: /run/secrets/runtime-transport-origin
      MEM0_V5_ACCOUNT_BINDING_HMAC_FILE: /run/secrets/account-binding-hmac-sha256
      MEM0_V5_BASE_INSTRUCTIONS_SHA256_FILE: /run/secrets/base-instructions-sha256
      MEM0_V5_QDRANT_ORIGIN: http://127.0.0.1:6334
      MEM0_V5_RUNTIME_REPO: /mnt/volume_ams3_1784742570542/infinity-context/runtimes/subscription-runtime/e904ec95/repo
      MEM0_V5_NODE_EXECUTABLE: /usr/local/bin/node
      MEM0_V5_SOURCE_AUTHORITY_MANIFEST_FILE: /run/source-authority/manifest.json
      MEM0_V5_SOURCE_AUTHORITY_MANIFEST_SHA256_FILE: /run/source-authority-pin/manifest.sha256
      MEM0_V5_PHASE_C_AUTHORITY_DIR: /mnt/volume_ams3_1784742570542/infinity-context/sources/9499b9c2
      HOME: /run/mem0-v5-state
      XDG_CACHE_HOME: /run/mem0-v5-state/cache
      XDG_CONFIG_HOME: /run/mem0-v5-state/config
      XDG_DATA_HOME: /run/mem0-v5-state/data
      XDG_STATE_HOME: /run/mem0-v5-state/state
    volumes:
      - type: bind
        source: ${MEM0_V5_INPUT_DIR:?set private sealed input directory}
        target: /run/mem0-v5-input
        read_only: true
      - type: bind
        source: ${MEM0_V5_STATE_DIR:?set private state directory}
        target: /run/mem0-v5-state
      - type: bind
        source: ${MEM0_V5_SECRET_DIR:?set private secret directory}
        target: /run/secrets
        read_only: true
      - type: bind
        source: ${MEM0_V5_RUNTIME_AUTHORITY_DIR:?set pinned subscription runtime e904ec95 directory}
        target: /mnt/volume_ams3_1784742570542/infinity-context/runtimes/subscription-runtime/e904ec95
        read_only: true
      - type: bind
        source: ${MEM0_V5_SOURCE_AUTHORITY_DIR:?set pinned Infinity source 9499b9c2 directory}
        target: /mnt/volume_ams3_1784742570542/infinity-context/sources/9499b9c2
        read_only: true
      - type: bind
        source: ${MEM0_V5_SOURCE_AUTHORITY_PIN_DIR:?set immutable Pin B directory}
        target: /run/source-authority
        read_only: true
      - type: bind
        source: ${MEM0_V5_SOURCE_AUTHORITY_PIN_SHA256_FILE:?set immutable Pin B SHA256 file}
        target: /run/source-authority-pin/manifest.sha256
        read_only: true
      - type: bind
        source: ${MEM0_V5_NODE_EXECUTABLE_SOURCE:-/usr/local/bin/node}
        target: /usr/local/bin/node
        read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1770,uid=65532,gid=65532
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          value=json.load(urllib.request.urlopen('http://127.0.0.1:19091/health',timeout=2));
          assert value=={'ok':True,'service':'mem0-oss-adapter-v5','provider_calls':'dispatch_only'}
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    depends_on:
      mem0-oss-v5-qdrant:
        condition: service_started

  mem0-oss-v5-qdrant:
    image: qdrant/qdrant:v1.18.3@sha256:ecc81d662bb9bb734db879b94461eb44be38604fc259491d478ad7e673238a0d
    network_mode: host
    user: "65532:65532"
    read_only: true
    restart: "no"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 1.0
    environment:
      QDRANT__SERVICE__HOST: 127.0.0.1
      QDRANT__SERVICE__HTTP_PORT: 6334
      QDRANT__STORAGE__STORAGE_PATH: /qdrant/storage
      QDRANT__TELEMETRY_DISABLED: "true"
    tmpfs:
      - /qdrant/storage:size=1g,mode=0700,uid=65532,gid=65532
      - /tmp:size=32m,mode=1770,uid=65532,gid=65532

secrets:
  source-authority-manifest-sha256:
    file: ${MEM0_V5_SOURCE_AUTHORITY_PIN_SHA256_FILE:?set immutable Pin B SHA256 file}
