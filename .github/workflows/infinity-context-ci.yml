name: Infinity Context CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinity-context-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: infinity_context
          POSTGRES_PASSWORD: infinity_context
          POSTGRES_DB: infinity_context
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infinity_context -d infinity_context"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      INFINITY_CONTEXT_TEST_POSTGRES_URL: postgresql+asyncpg://infinity_context:infinity_context@127.0.0.1:5432/infinity_context

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.5"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --all-extras --frozen

      - name: Run memory quality gate
        run: make infinity-context-test-quality
