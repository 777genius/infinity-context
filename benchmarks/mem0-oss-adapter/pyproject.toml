[project]
name = "mem0-oss-benchmark-adapter"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.141.1",
  "fastembed==0.8.0",
  "httpx==0.28.1",
  "mem0ai==2.0.15",
  "pydantic==2.13.4",
  "qdrant-client==1.18.0",
  "uvicorn==0.52.1",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
