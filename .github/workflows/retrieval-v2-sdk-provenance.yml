name: Retrieval V2 SDK provenance

on:
  workflow_dispatch:
    inputs:
      service_revision:
        description: Deployed service source revision
        required: true
      capability_fingerprint:
        description: Qualified Retrieval V2 capability fingerprint
        required: true

permissions:
  contents: read

jobs:
  attest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/infinity_context_ts_sdk
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/infinity_context_ts_sdk/package-lock.json
      - run: npm ci
      - run: npm run verify
      - id: pack
        run: echo "artifact=$(npm pack --silent)" >> "$GITHUB_OUTPUT"
      - name: Bind immutable artifact provenance
        env:
          RETRIEVAL_V2_SDK_ARTIFACT: ${{ steps.pack.outputs.artifact }}
          RETRIEVAL_V2_PROVENANCE_OUTPUT: retrieval-v2-sdk-provenance.json
          RETRIEVAL_V2_SOURCE_REVISION: ${{ github.sha }}
          RETRIEVAL_V2_SDK_REVISION: ${{ github.sha }}
          RETRIEVAL_V2_SERVICE_REVISION: ${{ inputs.service_revision }}
          RETRIEVAL_V2_CAPABILITY_FINGERPRINT: ${{ inputs.capability_fingerprint }}
        run: npm run provenance:retrieval-v2
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-v2-sdk-${{ github.sha }}
          path: |
            packages/infinity_context_ts_sdk/${{ steps.pack.outputs.artifact }}
            packages/infinity_context_ts_sdk/retrieval-v2-sdk-provenance.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false
