name: Release Infinity Context

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: infinity-context-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      minor: ${{ steps.release.outputs.minor }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Validate immutable release source
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_tag="${REF_NAME}"
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            release_tag="${INPUT_TAG}"
          fi
          if ! [[ "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the exact vX.Y.Z form, got: ${release_tag}" >&2
            exit 1
          fi
          git fetch --force origin "refs/tags/${release_tag}:refs/tags/${release_tag}"
          git checkout --detach "refs/tags/${release_tag}"
          package_version="$(python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          if [ "${release_tag}" != "v${package_version}" ]; then
            echo "Tag ${release_tag} does not match pyproject version ${package_version}" >&2
            exit 1
          fi
          IFS='.' read -r major minor patch <<<"${package_version}"
          if [ -z "${major}" ] || [ -z "${minor}" ] || [ -z "${patch}" ]; then
            echo "Package version must use X.Y.Z, got: ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=${release_tag}"
            echo "version=${package_version}"
            echo "minor=${major}.${minor}"
            echo "commit=$(git rev-parse "${release_tag}^{commit}")"
          } >>"${GITHUB_OUTPUT}"

  build:
    name: Build and attest distributions
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13.5"

      - name: Build release distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build==1.5.0" "twine==7.0.0"
          python -m build --outdir dist
          python -m twine check --strict dist/*
          mkdir -p release-assets
          (
            cd dist
            sha256sum -- *.tar.gz *.whl | sort > ../release-assets/SHA256SUMS
          )

      - name: Upload release distributions
        uses: actions/upload-artifact@v7.0.1
        with:
          name: infinity-context-${{ needs.prepare.outputs.tag }}-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload release checksums
        uses: actions/upload-artifact@v7.0.1
        with:
          name: infinity-context-${{ needs.prepare.outputs.tag }}-checksums
          path: release-assets/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Attest Python distributions
        uses: actions/attest-build-provenance@v4.1.1
        with:
          subject-path: dist/*

  publish-pypi:
    name: Publish to PyPI
    needs:
      - prepare
      - build
    if: github.repository == '777genius/infinity-context'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/infinity-context
    permissions:
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: infinity-context-${{ needs.prepare.outputs.tag }}-distributions
          path: dist

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-container:
    name: Publish GHCR image
    needs:
      - prepare
      - build
    if: github.repository == '777genius/infinity-context'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/777genius/infinity-context
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=${{ needs.prepare.outputs.minor }}
            type=raw,value=${{ needs.prepare.outputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Infinity Context
            org.opencontainers.image.description=Reliable memory and context infrastructure for AI coding agents
            org.opencontainers.image.source=https://github.com/777genius/infinity-context
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  release:
    name: Create GitHub release
    needs:
      - prepare
      - build
      - publish-pypi
      - publish-container
    if: github.repository == '777genius/infinity-context'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: infinity-context-${{ needs.prepare.outputs.tag }}-distributions
          path: release-assets

      - name: Download release checksums
        uses: actions/download-artifact@v8.0.1
        with:
          name: infinity-context-${{ needs.prepare.outputs.tag }}-checksums
          path: release-assets

      - name: Create GitHub release without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; refusing to replace release assets." >&2
            exit 1
          else
            gh release create "${RELEASE_TAG}" release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Infinity Context ${RELEASE_TAG}" \
              --generate-notes \
              --verify-tag
          fi
