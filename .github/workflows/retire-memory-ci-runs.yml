name: Retire superseded memory PR checks
on:
  push:
    branches: [verify/memory-workbench-20261023]
    paths: [.github/workflows/retire-memory-ci-runs.yml]
permissions:
  actions: write
  pull-requests: read
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only superseded run 39986623703 from this PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          root = "https://api.github.com/repos/777genius/infinity-context"
          run_id = 39986623703
          old_sha = "03a1d0ee418f63f613fc945e7ad29fcdd7b673bc"
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
          }
          def request(path, method="GET"):
              with urlopen(Request(root + path, headers=headers, method=method), timeout=20) as response:
                  data = response.read()
                  return json.loads(data) if data else None
          pr = request("/pulls/91")
          assert pr["head"]["ref"] == "perf/memory-retrieval-20261023"
          assert pr["head"]["sha"] != old_sha, "Never cancel the current head"
          path = f"/actions/runs/{run_id}"
          run = request(path)
          assert run["head_sha"] == old_sha
          assert run["head_branch"] == "perf/memory-retrieval-20261023"
          assert run["event"] == "pull_request"
          assert run["path"] == ".github/workflows/infinity-context-ci.yml"
          if run["status"] == "completed":
              print(run_id, "already completed:", run["conclusion"])
          else:
              try:
                  request(path + "/cancel", "POST")
              except HTTPError as error:
                  if error.code != 409:
                      raise
              for _ in range(6):
                  time.sleep(5)
                  if request(path)["status"] == "completed":
                      break
              else:
                  try:
                      request(path + "/force-cancel", "POST")
                  except HTTPError as error:
                      if error.code != 409:
                          raise
              print(run_id, "superseded run cancellation requested; final head untouched")
          PY
