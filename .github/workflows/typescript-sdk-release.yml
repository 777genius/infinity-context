name: TypeScript SDK release

on:
  workflow_dispatch:
    inputs:
      sdk_tag:
        description: Exact dispatched protected annotated sdk-vX.Y.Z tag/ref
        required: true
        type: string
      reconcile_only:
        description: Verify and retain a receipt for an exact existing published release; never publish
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: typescript-sdk-release-${{ inputs.sdk_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build exact SDK bytes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.source.outputs.artifact_name }}
      commit: ${{ steps.resolve.outputs.commit }}
      tag: ${{ steps.resolve.outputs.tag }}
      tag_object: ${{ steps.resolve.outputs.tag_object }}
      version: ${{ steps.source.outputs.version }}
      workflow_sha256: ${{ steps.source.outputs.workflow_sha256 }}
    steps:
      - name: Resolve protected annotated tag and repository policy
        id: resolve
        shell: bash
        env:
          EXECUTED_REF: ${{ github.ref }}
          EXECUTED_WORKFLOW_REF: ${{ github.workflow_ref }}
          EXECUTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
          SDK_TAG: ${{ inputs.sdk_tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REPOSITORY}" != "777genius/infinity-context" ]; then
            echo "Release repository identity is not 777genius/infinity-context" >&2
            exit 1
          fi
          if ! [[ "${SDK_TAG}" =~ ^sdk-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "sdk_tag must use exact sdk-vX.Y.Z form" >&2
            exit 1
          fi
          if [ "${EXECUTED_REF}" != "refs/tags/${SDK_TAG}" ]; then
            echo "Dispatch must execute the exact refs/tags/${SDK_TAG} ref" >&2
            exit 1
          fi
          expected_workflow_ref="${GITHUB_REPOSITORY}/.github/workflows/typescript-sdk-release.yml@refs/tags/${SDK_TAG}"
          if [ "${EXECUTED_WORKFLOW_REF}" != "${expected_workflow_ref}" ]; then
            echo "Executed workflow ref is not the reviewed SDK tag ref" >&2
            exit 1
          fi

          tag_ref="$(gh api -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${SDK_TAG}")"
          if [ "$(jq -r '.object.type' <<<"${tag_ref}")" != "tag" ]; then
            echo "${SDK_TAG} must be an existing annotated tag" >&2
            exit 1
          fi
          tag_object="$(jq -r '.object.sha' <<<"${tag_ref}")"
          tag_json="$(gh api -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}")"
          if [ "$(jq -r '.object.type' <<<"${tag_json}")" != "commit" ]; then
            echo "${SDK_TAG} must directly annotate one commit" >&2
            exit 1
          fi
          commit="$(jq -r '.object.sha' <<<"${tag_json}")"
          if ! [[ "${commit}" =~ ^[0-9a-f]{40}$|^[0-9a-f]{64}$ ]]; then
            echo "Annotated tag target is malformed" >&2
            exit 1
          fi
          if [ "${EXECUTED_WORKFLOW_SHA}" != "${commit}" ]; then
            echo "Executed workflow SHA does not equal the annotated tag commit" >&2
            exit 1
          fi

          ruleset_summaries="$(gh api --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/rulesets?targets=tag&per_page=100")"
          rulesets='[]'
          while IFS= read -r ruleset_id; do
            [ -n "${ruleset_id}" ] || continue
            item="$(gh api -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}?includes_parents=true")"
            rulesets="$(jq --argjson item "${item}" '. + [$item]' <<<"${rulesets}")"
          done < <(jq -r '.[][] | .id' <<<"${ruleset_summaries}")
          if ! jq -e --arg ref "refs/tags/${SDK_TAG}" '
            [ .[]
              | select(.target == "tag" and .enforcement == "active")
              | select((([.rules[].type] | index("creation")) != null) and
                       (([.rules[].type] | index("update")) != null) and
                       (([.rules[].type] | index("deletion")) != null))
              | .conditions.ref_name as $names
              | select(($names.exclude | length) == 0)
              | select(any($names.include[]?;
                  . == "~ALL" or . == $ref or
                  (. == "refs/tags/sdk-v*" and ($ref | startswith("refs/tags/sdk-v")))))
            ] | length > 0
          ' <<<"${rulesets}" >/dev/null; then
            echo "The GitHub API did not confirm active creation/update/deletion protection for ${SDK_TAG}" >&2
            exit 1
          fi

          {
            echo "commit=${commit}"
            echo "tag=${SDK_TAG}"
            echo "tag_object=${tag_object}"
          } >>"${GITHUB_OUTPUT}"

      - name: Checkout exact tag commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.resolve.outputs.commit }}

      - name: Revalidate clean source, repository, tag, and package identity
        id: source
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ steps.resolve.outputs.commit }}
          EXPECTED_TAG_OBJECT: ${{ steps.resolve.outputs.tag_object }}
          SDK_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{commit})" = "${EXPECTED_COMMIT}"
          test "$(git rev-parse "${SDK_TAG}^{tag}")" = "${EXPECTED_TAG_OBJECT}"
          test "$(git rev-parse "${SDK_TAG}^{commit}")" = "${EXPECTED_COMMIT}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          remote="$(git remote get-url origin | sed -E \
            -e 's#^git@github.com:#https://github.com/#' \
            -e 's#^git\+https://#https://#' -e 's#\.git$##')"
          test "${remote}" = "https://github.com/${GITHUB_REPOSITORY}"
          version="$(node -p "require('./packages/infinity_context_ts_sdk/package.json').version")"
          node -e '
            const parsed = process.argv.slice(1).map((x) => {
              if (!/^(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)$/.test(x)) process.exit(1);
              return x.split(".").map(Number);
            });
            const [version, floor] = parsed;
            for (let index = 0; index < 3; index += 1) {
              if (version[index] > floor[index]) process.exit(0);
              if (version[index] < floor[index]) process.exit(1);
            }
          ' "${version}" "0.2.1"
          test "${SDK_TAG}" = "sdk-v${version}"
          artifact_name="infinity-context-sdk-${version}.tgz"
          workflow_sha256="$(sha256sum .github/workflows/typescript-sdk-release.yml | cut -d' ' -f1)"
          {
            echo "artifact_name=${artifact_name}"
            echo "version=${version}"
            echo "workflow_sha256=${workflow_sha256}"
          } >>"${GITHUB_OUTPUT}"

      - name: Set up exact Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: packages/infinity_context_ts_sdk/package-lock.json

      - name: Install and verify SDK without packing
        working-directory: packages/infinity_context_ts_sdk
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.18.0"
          npm ci
          npm run lint
          npm run check:architecture
          npm run check:retrieval-v2-parity
          npm run check:parity
          npm run typecheck
          npm run test
          npm run build
          npm run check:exports

      - name: Pack SDK exactly once
        id: pack
        working-directory: packages/infinity_context_ts_sdk
        shell: bash
        env:
          EXPECTED_ARTIFACT: ${{ steps.source.outputs.artifact_name }}
        run: |
          set -euo pipefail
          pack_json="$(npm pack --json)"
          artifact_name="$(jq -er \
            'if length == 1 then .[0].filename else error("expected exactly one pack result") end' \
            <<<"${pack_json}")"
          test "${artifact_name}" = "${EXPECTED_ARTIFACT}"
          test -f "${artifact_name}"
          echo "artifact_name=${artifact_name}" >>"${GITHUB_OUTPUT}"

      - name: Test the same packed tarball
        working-directory: packages/infinity_context_ts_sdk
        run: node scripts/check-consumer-install.mjs --artifact "${{ steps.pack.outputs.artifact_name }}"

      - name: Create deterministic SDK release manifest
        shell: bash
        env:
          SDK_ARTIFACT: ${{ steps.pack.outputs.artifact_name }}
          SDK_TAG: ${{ steps.resolve.outputs.tag }}
          WORKFLOW_SHA256: ${{ steps.source.outputs.workflow_sha256 }}
        run: |
          set -euo pipefail
          mkdir release-bundle
          cp "packages/infinity_context_ts_sdk/${SDK_ARTIFACT}" release-bundle/
          node packages/infinity_context_ts_sdk/scripts/sdk-release-manifest.mjs \
            --artifact "${GITHUB_WORKSPACE}/release-bundle/${SDK_ARTIFACT}" \
            --artifact-root "${GITHUB_WORKSPACE}/release-bundle" \
            --build-profile node24-npm-ci-pack-once.v1 \
            --node-version 24.18.0 \
            --output "${GITHUB_WORKSPACE}/release-bundle/infinity-context-sdk-release-manifest.json" \
            --output-root "${GITHUB_WORKSPACE}/release-bundle" \
            --package-root "${GITHUB_WORKSPACE}/packages/infinity_context_ts_sdk" \
            --repository "${GITHUB_REPOSITORY}" \
            --repository-root "${GITHUB_WORKSPACE}" \
            --tag "${SDK_TAG}" \
            --workflow-path .github/workflows/typescript-sdk-release.yml \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-sha256 "${WORKFLOW_SHA256}"
          expected="$(printf '%s\n' "${SDK_ARTIFACT}" infinity-context-sdk-release-manifest.json | sort)"
          actual="$(find release-bundle -maxdepth 1 -type f -printf '%f\n' | sort)"
          test "${actual}" = "${expected}"

      - name: Transfer exactly two release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typescript-sdk-release-${{ steps.resolve.outputs.tag }}
          path: release-bundle/
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 1

  policy_preflight:
    name: Confirm protected immutable-release policy
    needs: build
    if: github.repository == '777genius/infinity-context'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: sdk-release-policy
    permissions: {}
    steps:
      - name: Read immutable-release policy with isolated administration token
        shell: bash
        env:
          ADMIN_READ_TOKEN: ${{ secrets.SDK_RELEASE_ADMIN_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REPOSITORY}" != "777genius/infinity-context" ]; then
            echo "Release repository identity is not 777genius/infinity-context" >&2
            exit 1
          fi
          if [ -z "${ADMIN_READ_TOKEN:-}" ]; then
            echo "SDK_RELEASE_ADMIN_READ_TOKEN is required in sdk-release-policy" >&2
            exit 1
          fi
          if ! immutable_releases="$(curl --fail-with-body --silent --show-error \
            --request GET \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${ADMIN_READ_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/immutable-releases")"; then
            echo "Administration-read immutable-releases policy request was denied" >&2
            exit 1
          fi
          if ! jq -e 'type == "object" and .enabled == true' \
            <<<"${immutable_releases}" >/dev/null; then
            echo "Immutable releases are disabled or the policy response is malformed" >&2
            exit 1
          fi

  publish:
    name: Publish protected immutable SDK release
    needs: [build, policy_preflight]
    if: github.repository == '777genius/infinity-context'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout exact release source for semantic verification
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.build.outputs.commit }}

      - name: Set up exact Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.18.0"

      - name: Download exact two-file transport
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: typescript-sdk-release-${{ needs.build.outputs.tag }}
          path: release-bundle

      - name: Rehash and semantically revalidate transported evidence
        shell: bash
        env:
          SDK_ARTIFACT: ${{ needs.build.outputs.artifact_name }}
          SDK_TAG: ${{ needs.build.outputs.tag }}
          WORKFLOW_SHA256: ${{ needs.build.outputs.workflow_sha256 }}
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.18.0"
          expected="$(printf '%s\n' "${SDK_ARTIFACT}" infinity-context-sdk-release-manifest.json | sort)"
          actual="$(find release-bundle -maxdepth 1 -type f -printf '%f\n' | sort)"
          test "${actual}" = "${expected}"
          node packages/infinity_context_ts_sdk/scripts/sdk-release-manifest.mjs \
            --artifact "${GITHUB_WORKSPACE}/release-bundle/${SDK_ARTIFACT}" \
            --artifact-root "${GITHUB_WORKSPACE}/release-bundle" \
            --build-profile node24-npm-ci-pack-once.v1 \
            --manifest "${GITHUB_WORKSPACE}/release-bundle/infinity-context-sdk-release-manifest.json" \
            --node-version 24.18.0 \
            --output-root "${GITHUB_WORKSPACE}/release-bundle" \
            --package-root "${GITHUB_WORKSPACE}/packages/infinity_context_ts_sdk" \
            --repository "${GITHUB_REPOSITORY}" \
            --repository-root "${GITHUB_WORKSPACE}" \
            --tag "${SDK_TAG}" \
            --workflow-path .github/workflows/typescript-sdk-release.yml \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-sha256 "${WORKFLOW_SHA256}"

      - name: Preflight GitHub CLI release verification syntax
        shell: bash
        run: |
          set -euo pipefail
          verify_help="$(gh release verify --help)"
          grep -Fq 'gh release verify [<tag>] [flags]' <<<"${verify_help}"
          grep -Eq -- '(^|[[:space:]])(-R, )?--repo[ =]' <<<"${verify_help}"
          grep -Eq -- '(^|[[:space:]])--format[ =]' <<<"${verify_help}"
          verify_asset_help="$(gh release verify-asset --help)"
          grep -Fq 'gh release verify-asset [<tag>] <file-path> [flags]' \
            <<<"${verify_asset_help}"
          grep -Eq -- '(^|[[:space:]])(-R, )?--repo[ =]' <<<"${verify_asset_help}"
          grep -Eq -- '(^|[[:space:]])--format[ =]' <<<"${verify_asset_help}"

      - name: Publish once or reconcile exact published evidence
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RECONCILE_ONLY: ${{ inputs.reconcile_only }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SDK_ARTIFACT: ${{ needs.build.outputs.artifact_name }}
          SDK_VERSION: ${{ needs.build.outputs.version }}
          TAG_OBJECT: ${{ needs.build.outputs.tag_object }}
          WORKFLOW_SHA256: ${{ needs.build.outputs.workflow_sha256 }}
        run: |
          set -euo pipefail
          bash packages/infinity_context_ts_sdk/scripts/sdk-release-publish.sh

      - name: Create non-release verification receipt
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          node packages/infinity_context_ts_sdk/scripts/sdk-release-receipt.mjs \
            --asset-dir "${GITHUB_WORKSPACE}/verification-receipt" \
            --output "${GITHUB_WORKSPACE}/verification-receipt/infinity-context-sdk-release-verification-receipt.json" \
            --output-root "${GITHUB_WORKSPACE}/verification-receipt" \
            --release-attestation-json "${GITHUB_WORKSPACE}/verification-receipt/release-attestation.json" \
            --release-commit "${{ needs.build.outputs.commit }}" \
            --release-json "${GITHUB_WORKSPACE}/verification-receipt/release.json" \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${RELEASE_TAG}"

      - name: Retain verification receipt for Discord and operations custody
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typescript-sdk-release-verification-${{ needs.build.outputs.tag }}
          path: verification-receipt/infinity-context-sdk-release-verification-receipt.json
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 90
