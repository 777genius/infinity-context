[project]
name = "mem0-oss-benchmark-adapter-v5"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.141.1",
  "fastembed==0.8.0",
  "huggingface-hub==1.26.0",
  "httpx==0.28.1",
  "mem0ai==2.0.15",
  "packaging==26.2",
  "posthog==7.37.3",
  "pydantic==2.13.4",
  "qdrant-client==1.18.0",
  "starlette==1.3.1",
  "uvicorn==0.52.1",
]

[project.scripts]
infinity-context-publishable-mem0-v5 = "publishable_mem0_v5.cli:main"

[tool.setuptools.packages.find]
where = [".", "deployment"]
include = ["mem0_oss_adapter_v5*", "publishable_mem0_v5*"]

[dependency-groups]
dev = [
  "infinity-context",
  "pytest==9.1.1",
  "pyyaml==6.0.3",
  "ruff==0.16.1",
]

[tool.uv.sources]
infinity-context = { path = "../..", editable = true }

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = [
  ".",
  "deployment",
  "../../packages/infinity_context_core",
  "../../packages/infinity_context_server",
  "../../packages/infinity_context_runtime_bridge",
  "../../packages/infinity_context_adapters",
]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
