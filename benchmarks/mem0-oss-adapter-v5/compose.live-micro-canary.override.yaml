services:
  mem0-oss-v5-container-init:
    image: ${MEM0_V5_ADAPTER_IMAGE_ID:?set exact cached adapter sha256 image ID}
    pull_policy: never
    network_mode: none
    user: "0:0"
    read_only: true
    restart: "no"
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    entrypoint: [python, -c]
    command:
      - |-
        import hashlib, json, os, stat
        from pathlib import Path

        uid = gid = 65532
        secret_names = (
            "account-binding-hmac-sha256",
            "base-instructions-sha256",
            "ingress-bearer",
            "result-hmac",
            "runtime-attestation-secret",
            "runtime-bearer",
            "runtime-receipt-secret",
            "runtime-transport-origin",
            "state-hmac",
        )

        def directory(path, *, empty, owner=None, mode=None):
            value = Path(path)
            metadata = value.lstat()
            if value.is_symlink() or not stat.S_ISDIR(metadata.st_mode):
                raise RuntimeError("container_copy_directory_invalid")
            if empty and any(value.iterdir()):
                raise RuntimeError("container_copy_directory_not_empty")
            if owner is not None:
                os.chown(value, owner, owner)
            if mode is not None:
                os.chmod(value, mode)
            return value

        def read_exact(path, mode):
            descriptor = os.open(path, os.O_RDONLY | os.O_CLOEXEC | getattr(os, "O_NOFOLLOW", 0))
            try:
                opened = os.fstat(descriptor)
                identity = (opened.st_dev, opened.st_ino, opened.st_size, opened.st_mtime_ns)
                if not stat.S_ISREG(opened.st_mode) or opened.st_nlink != 1 or stat.S_IMODE(opened.st_mode) != mode:
                    raise RuntimeError("container_copy_source_invalid")
                chunks = []
                while True:
                    chunk = os.read(descriptor, 65536)
                    if not chunk:
                        break
                    chunks.append(chunk)
                final = os.fstat(descriptor)
                if identity != (final.st_dev, final.st_ino, final.st_size, final.st_mtime_ns):
                    raise RuntimeError("container_copy_source_changed")
                return b"".join(chunks)
            finally:
                os.close(descriptor)

        def copy_exact(source, target, source_mode, target_mode):
            raw = read_exact(source, source_mode)
            descriptor = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_CLOEXEC, target_mode)
            try:
                view = memoryview(raw)
                written = 0
                while written < len(view):
                    count = os.write(descriptor, view[written:])
                    if count <= 0:
                        raise RuntimeError("container_copy_short_write")
                    written += count
                os.fchmod(descriptor, target_mode)
                os.fchown(descriptor, uid, gid)
                os.fsync(descriptor)
            finally:
                os.close(descriptor)
            prepared = read_exact(target, target_mode)
            source_sha = hashlib.sha256(raw).hexdigest()
            prepared_sha = hashlib.sha256(prepared).hexdigest()
            metadata = os.stat(target, follow_symlinks=False)
            if source_sha != prepared_sha or metadata.st_uid != uid or metadata.st_gid != gid:
                raise RuntimeError("container_copy_attestation_failed")
            return {"source_sha256": source_sha, "prepared_sha256": prepared_sha, "mode": f"{target_mode:04o}"}

        source_input = directory("/host/input", empty=False)
        source_secrets = directory("/host/secrets", empty=False)
        target_input = directory("/prepared/input", empty=True, owner=uid, mode=0o700)
        target_secrets = directory("/prepared/secrets", empty=True, owner=uid, mode=0o700)
        adapter_state = directory("/prepared/adapter-state", empty=True, owner=uid, mode=0o700)
        qdrant_state = directory("/prepared/qdrant-state", empty=True, owner=uid, mode=0o700)
        authority_root = directory("/prepared/authority", empty=True, owner=0, mode=0o755)
        roots = (source_input, source_secrets, target_input, target_secrets, adapter_state, qdrant_state, authority_root)
        identities = {(value.stat().st_dev, value.stat().st_ino) for value in roots}
        if len(identities) != len(roots):
            raise RuntimeError("container_copy_roots_overlap")
        input_receipt = copy_exact(source_input / "manifest.json", target_input / "manifest.json", 0o400, 0o400)
        secret_receipts = {
            name: copy_exact(source_secrets / name, target_secrets / name, 0o600, 0o600)
            for name in secret_names
        }
        for value in (target_input, target_secrets, adapter_state, qdrant_state):
            metadata = value.stat()
            if metadata.st_uid != uid or metadata.st_gid != gid or stat.S_IMODE(metadata.st_mode) != 0o700:
                raise RuntimeError("container_copy_ownership_failed")
        payload = {
            "schema_version": "managed-mem0-v5-container-copy.v1",
            "container_uid": uid,
            "container_gid": gid,
            "directory_mode": "0700",
            "input": {"manifest.json": input_receipt},
            "secrets": secret_receipts,
            "state": {
                "adapter": {"uid": uid, "gid": gid, "mode": "0700"},
                "qdrant": {"uid": uid, "gid": gid, "mode": "0700"},
            },
        }
        encoded = json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()
        authority = authority_root / "container-copy-authority.json"
        descriptor = os.open(authority, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_CLOEXEC, 0o444)
        try:
            view = memoryview(encoded)
            written = 0
            while written < len(view):
                count = os.write(descriptor, view[written:])
                if count <= 0:
                    raise RuntimeError("container_copy_authority_short_write")
                written += count
            os.fchmod(descriptor, 0o444)
            os.fsync(descriptor)
        finally:
            os.close(descriptor)
    volumes:
      - type: bind
        source: ${MEM0_V5_HOST_INPUT_DIR:?set host-runner private input directory}
        target: /host/input
        read_only: true
      - type: bind
        source: ${MEM0_V5_HOST_SECRET_DIR:?set host-runner private secret directory}
        target: /host/secrets
        read_only: true
      - type: bind
        source: ${MEM0_V5_CONTAINER_INPUT_DIR:?set empty container-owned input directory}
        target: /prepared/input
      - type: bind
        source: ${MEM0_V5_CONTAINER_SECRET_DIR:?set empty container-owned secret directory}
        target: /prepared/secrets
      - type: bind
        source: ${MEM0_V5_ADAPTER_STATE_DIR:?set empty adapter state directory}
        target: /prepared/adapter-state
      - type: bind
        source: ${MEM0_V5_QDRANT_STATE_DIR:?set empty qdrant state directory}
        target: /prepared/qdrant-state
      - type: bind
        source: ${MEM0_V5_CONTAINER_COPY_AUTHORITY_DIR:?set empty public copy authority directory}
        target: /prepared/authority

  mem0-oss-v5-qdrant:
    image: ${MEM0_V5_QDRANT_IMAGE_ID:?set exact cached qdrant sha256 image ID}
    pull_policy: never
    network_mode: host
    user: "65532:65532"
    read_only: true
    restart: "no"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 1.0
    environment:
      QDRANT__SERVICE__HOST: 127.0.0.1
      QDRANT__SERVICE__HTTP_PORT: ${MEM0_V5_QDRANT_PORT:?set explicit qdrant port}
      QDRANT__STORAGE__STORAGE_PATH: /qdrant/storage
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/storage/snapshots
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - type: bind
        source: ${MEM0_V5_QDRANT_STATE_DIR:?set prepared qdrant state directory}
        target: /qdrant/storage
    depends_on:
      mem0-oss-v5-container-init:
        condition: service_completed_successfully

  mem0-oss-adapter-v5:
    image: ${MEM0_V5_ADAPTER_IMAGE_ID:?set exact cached adapter sha256 image ID}
    pull_policy: never
    network_mode: host
    user: "65532:65532"
    read_only: true
    init: true
    restart: "no"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 4g
    cpus: 2.0
    command:
      - uvicorn
      - mem0_oss_adapter_v5.composition:build_app_from_environment
      - --factory
      - --host
      - 127.0.0.1
      - --port
      - ${MEM0_V5_ADAPTER_PORT:?set explicit adapter port}
      - --no-access-log
      - --no-proxy-headers
    environment:
      MEM0_V5_INPUT_MANIFEST_FILE: /run/mem0-v5-input/manifest.json
      MEM0_V5_STATE_DB_FILE: /run/mem0-v5-state/operations.sqlite3
      MEM0_V5_INGRESS_BEARER_FILE: /run/secrets/ingress-bearer
      MEM0_V5_STATE_HMAC_FILE: /run/secrets/state-hmac
      MEM0_V5_RESULT_HMAC_FILE: /run/secrets/result-hmac
      MEM0_V5_RUNTIME_ATTESTATION_SECRET_FILE: /run/secrets/runtime-attestation-secret
      MEM0_V5_RUNTIME_BEARER_FILE: /run/secrets/runtime-bearer
      MEM0_V5_RECEIPT_SECRET_FILE: /run/secrets/runtime-receipt-secret
      MEM0_V5_RUNTIME_TRANSPORT_ORIGIN_FILE: /run/secrets/runtime-transport-origin
      MEM0_V5_ACCOUNT_BINDING_HMAC_FILE: /run/secrets/account-binding-hmac-sha256
      MEM0_V5_BASE_INSTRUCTIONS_SHA256_FILE: /run/secrets/base-instructions-sha256
      MEM0_V5_QDRANT_ORIGIN: http://127.0.0.1:${MEM0_V5_QDRANT_PORT:?set explicit qdrant port}
      MEM0_V5_RUNTIME_AUTHORITY_DIR: ${MEM0_V5_RUNTIME_AUTHORITY_CONTAINER:?set runtime authority container path}
      MEM0_V5_RUNTIME_REPO: ${MEM0_V5_RUNTIME_REPO_CONTAINER:?set immutable runtime repo path}
      MEM0_V5_NODE_EXECUTABLE: ${MEM0_V5_NODE_EXECUTABLE_CONTAINER:?set immutable node path}
      MEM0_V5_SOURCE_AUTHORITY_MANIFEST_FILE: /run/source-authority/manifest.json
      MEM0_V5_SOURCE_AUTHORITY_MANIFEST_SHA256_FILE: /run/source-authority-pin/manifest.sha256
      MEM0_V5_PHASE_C_AUTHORITY_DIR: ${MEM0_V5_PHASE_C_AUTHORITY_CONTAINER:?set authority path}
      HOME: /run/mem0-v5-state
      XDG_CACHE_HOME: /run/mem0-v5-state/cache
      XDG_CONFIG_HOME: /run/mem0-v5-state/config
      XDG_DATA_HOME: /run/mem0-v5-state/data
      XDG_STATE_HOME: /run/mem0-v5-state/state
    volumes:
      - type: bind
        source: ${MEM0_V5_CONTAINER_INPUT_DIR:?set prepared container-owned input directory}
        target: /run/mem0-v5-input
        read_only: true
      - type: bind
        source: ${MEM0_V5_ADAPTER_STATE_DIR:?set prepared adapter state directory}
        target: /run/mem0-v5-state
      - type: bind
        source: ${MEM0_V5_CONTAINER_SECRET_DIR:?set prepared container-owned secret directory}
        target: /run/secrets
        read_only: true
      - type: bind
        source: ${MEM0_V5_RUNTIME_AUTHORITY_DIR:?set immutable runtime authority directory}
        target: ${MEM0_V5_RUNTIME_AUTHORITY_CONTAINER:?set runtime authority container path}
        read_only: true
      - type: bind
        source: ${MEM0_V5_SOURCE_AUTHORITY_DIR:?set immutable source authority directory}
        target: ${MEM0_V5_PHASE_C_AUTHORITY_CONTAINER:?set authority path}
        read_only: true
      - type: bind
        source: ${MEM0_V5_SOURCE_AUTHORITY_PIN_DIR:?set immutable source pin directory}
        target: /run/source-authority
        read_only: true
      - type: bind
        source: ${MEM0_V5_SOURCE_AUTHORITY_PIN_SHA256_FILE:?set immutable source pin digest}
        target: /run/source-authority-pin/manifest.sha256
        read_only: true
      - type: bind
        source: ${MEM0_V5_NODE_EXECUTABLE_SOURCE:?set immutable node executable}
        target: ${MEM0_V5_NODE_EXECUTABLE_CONTAINER:?set immutable node path}
        read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1770,uid=65532,gid=65532
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import socket;
          connection=socket.create_connection(('127.0.0.1',int('${MEM0_V5_ADAPTER_PORT:?set explicit adapter port}')),2);
          connection.close()
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    depends_on:
      mem0-oss-v5-container-init:
        condition: service_completed_successfully
      mem0-oss-v5-qdrant:
        condition: service_started
