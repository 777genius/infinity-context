name: Memory optimization workbench
on:
  push:
    branches: [verify/memory-workbench-20261023]
permissions:
  contents: read
jobs:
  workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 44ac164a8395c5847ae8792dded95d0dfe4526dd
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.5"
      - name: Export tracked source and locked offline dependencies
        run: |
          mkdir -p workbench/wheels
          git rev-parse HEAD > workbench/source-sha.txt
          git archive HEAD | gzip > workbench/source.tar.gz
          python -m pip install --disable-pip-version-check 'uv==0.11.28'
          uv export --extra dev --extra qdrant --frozen --no-hashes --no-emit-project -o workbench/requirements.txt
          python -m pip download --only-binary=:all: --dest workbench/wheels -r workbench/requirements.txt 'setuptools>=80' wheel
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: memory-workbench-py313-44ac164a
          path: workbench/
          retention-days: 7
          if-no-files-found: error
