name: Memory optimization workbench
on:
  push:
    branches: [verify/memory-workbench-20261023]
    paths: [.github/workflows/memory-workbench.yml]
permissions:
  contents: read
jobs:
  workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 03a1d0ee418f63f613fc945e7ad29fcdd7b673bc
          fetch-depth: 0
          persist-credentials: false
      - name: Export pinned source and reviewable history
        run: |
          test "$(git rev-parse HEAD)" = 03a1d0ee418f63f613fc945e7ad29fcdd7b673bc
          mkdir -p workbench
          git rev-parse HEAD > workbench/source-sha.txt
          git archive HEAD | gzip > workbench/source.tar.gz
          git branch export-memory-head HEAD
          git bundle create workbench/repository.bundle export-memory-head
          sha256sum workbench/source.tar.gz workbench/repository.bundle > workbench/SHA256SUMS
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: memory-source-03a1d0ee
          path: workbench/
          retention-days: 7
          if-no-files-found: error
